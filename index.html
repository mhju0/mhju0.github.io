function imageBlock(p,linked=true){const body=`<img loading="${linked?'lazy':'eager'}" decoding="async" src="${assets[p.img]}" alt="${escapeHtml(name(p)+' · '+pick(p.caption))}">${p.extra?`<img loading="${linked?'lazy':'eager'}" decoding="async" src="${assets[p.extra]}" alt="${t('Filing Digest 인용 답변 화면','Filing Digest cited answer screen')}">`:''}`;return linked?`<a class="visual ${p.kind||''}" href="#project/${p.id}" aria-label="${escapeHtml(name(p))} ${t('상세 읽기','project details')}">${body}</a>`:`<div class="visual ${p.kind||''}">${body}</div>`}
function nav(){
 const languageItem=(code,label)=>{
  if((language?'en':'ko')===code)return `<span class="navbutton nav-current" aria-current="true" lang="${code}">${label}</span>`;
  const u=new URL(location);u.pathname='/'+code+'/';u.search='';
  return `<a class="navbutton" href="${u.href}" data-language lang="${code}" aria-label="${code==='en'?'Read in English':'한국어로 보기'}">${label}</a>`;
 };
 return `<header class="site-nav"><a class="name" href="#home">${t('주민현','Michael Ju')}</a><nav class="navlinks" aria-label="${t('주 메뉴','Main navigation')}"><a class="navbutton" href="#about">${t('소개','ABOUT')}</a><a class="navbutton" href="#projects">${t('프로젝트','PROJECTS')}</a>${languageItem('ko','KO')}${languageItem('en','EN')}</nav></header>`;
}
function footer(){return `<footer><nav class="footer-links" aria-label="${t('외부 프로필','External profiles')}"><a href="https://github.com/mhju0" target="_blank" rel="noreferrer">GitHub</a><a href="https://www.linkedin.com/in/michael-ju/" target="_blank" rel="noreferrer">LinkedIn</a><a href="https://velog.io/@mhju" target="_blank" rel="noreferrer">Velog</a></nav></footer>`}
function row(p,i){return `<article class="project text-project" id="p-${p.id}"><div class="project-title"><p class="number">${String(i+1).padStart(2,'0')} / ${pick(p.type)}</p><h3><a href="#project/${p.id}">${name(p)}</a></h3></div><div class="project-summary"><p class="description">${pick(p.desc)}</p><p class="stack">${p.stack}</p><a class="read" href="#project/${p.id}">${t('프로젝트 자세히 보기','View project details')}</a></div></article>`}
const caseQuestions={"filing-digest": [["긴 공시에서 무엇을 먼저 확인하고 싶었나?", "What did I want to find in a long filing?"], ["공시 원문을 어떻게 앱까지 연결했나?", "How did filings reach the app?"], ["왜 수치와 AI 설명을 분리했나?", "Why separate figures from AI explanations?"], ["설명이 실패하면 어디까지 반환하나?", "What remains when an explanation fails?"]], "filing-agent": [["공시를 읽은 다음 질문은 무엇인가?", "What comes after the first filing question?"], ["Digest의 자료 조사에서 어떻게 이어졌나?", "How does this relate to Digest’s data?"], ["모델이 계산까지 맡아야 할까?", "Should the model do the arithmetic?"], ["어떤 대화 흐름을 검증했나?", "Which conversation flows did I check?"]], "fullcourt": [["이 경기를 앞두고 두 팀은 얼마나 쉬었을까?", "How much rest has each team had?"], ["일정을 어떻게 비교 가능한 정보로 바꿨나?", "How did schedules become comparable?"], ["휴식 지표가 승패 예측과 같은가?", "Is a rest indicator a prediction?"], ["이 화면에서 어디까지 판단할 수 있나?", "What can this page actually tell us?"]], "raintoday": [["화려한 날씨 화면보다 필요한 것은?", "What mattered more than weather visuals?"], ["예보와 관측을 어떻게 연결했나?", "How did forecasts connect to observations?"], ["왜 발표 당시의 예보를 보존하나?", "Why preserve a forecast as issued?"], ["데이터가 없으면 비가 안 오는 걸까?", "Does missing data mean no rain?"]], "mammacare": [["팀이 풀고자 한 기록 문제는 무엇인가?", "What recording problem did the team choose?"], ["팀장으로 무엇을 맡았나?", "What did I own as team lead?"], ["모든 식단에 AI 호출이 필요할까?", "Does every meal plan need an AI call?"], ["어느 시기의 작업을 설명하고 있나?", "Which phase of the project does this cover?"]], "allergy-tracker": [["팀 프로젝트의 주제를 어떻게 개인 앱으로 다시 다뤘나?", "What did I revisit from the team project?"], ["관찰 기록을 어떻게 기기에 보관하나?", "How are observations stored on the device?"], ["계정과 서버 동기화 없이 만들면?", "What changes without accounts or server sync?"], ["기록 도구가 판단해 주지 않는 것은?", "What does a recording tool not decide?"]], "stock-game": [["모의투자에서도 거래 규칙이 중요한 이유는?", "Why do trading rules matter in a simulation?"], ["주문과 계정 기능을 어디까지 연결했나?", "Which trading and account features did I connect?"], ["거래 후 기록이 실패하면 주문을 다시 실행할까?", "Should an order run again if later recording fails?"], ["현재 검증으로 보장할 수 없는 것은?", "What has not been established by the tests?"]], "glass-table": [["결과가 좋으면 좋은 선택이었을까?", "Does a good outcome mean a good decision?"], ["계산 엔진과 앱을 어떻게 나눴나?", "How did I separate the engine from the app?"], ["화면 없이 계산과 채점을 검사할 수 있을까?", "Can calculations and grading be tested without the UI?"], ["이 앱의 계산은 어디까지 적용되나?", "Where do these calculations apply?"]]};
function projectLinks(p){return `<div class="links">${p.link?`<a href="${p.link}" target="_blank" rel="noreferrer">${t(p.id.startsWith('filing-')?'기록된 데모 보기 ↗':'서비스 열기 ↗',p.id.startsWith('filing-')?'Open recorded demo ↗':'Open application ↗')}</a>`:''}${p.code?`<a href="${p.code}" target="_blank" rel="noreferrer">${t(p.id==='filing-agent'?'기술 소개·소스 ↗':'GitHub ↗',p.id==='filing-agent'?'Engineering notes & source ↗':'GitHub ↗')}</a>`:''}</div>`}
function gallery(p){const keys=[p.img,...(p.extra?[p.extra]:[])];return `<div class="screen-gallery ${p.kind==='phones'?'':p.kind==='singlephone'?'single':'web'}">${keys.map((key,i)=>`<figure><button data-screen="${key}" aria-label="${escapeHtml(name(p))} ${t('화면 확대','enlarge screenshot')}"><img src="${assets[key]}" alt="${escapeHtml(name(p)+' · '+pick(p.caption))}" loading="lazy"></button><figcaption>${keys.length>1?String(i+1).padStart(2,'0')+' · ':''}${pick(p.caption)} · ${t('눌러서 확대','Select to enlarge')}</figcaption></figure>`).join('')}</div>`}
function decisionVisual(p){if(!['filing-digest','filing-agent','raintoday','glass-table'].includes(p.id))return '';const diagrams={
'filing-digest':[['수치를 가져오는 경로','Reported figures'],['구조화 데이터에서 조회','Retrieved from structured data'],['설명을 만드는 경로','AI explanations'],['설명 생성 후 인용·수치 검사','Generation followed by citation and number checks'],['일부 생성·검증 실패에서는 설명을 제한하고 수치는 반환합니다.','Certain generation or validation failures limit the explanation while preserving figures.']],
'filing-agent':[['모델이 맡는 일','Model responsibility'],['질문의 의도 해석','Interpret the question'],['코드가 맡는 일','Code responsibility'],['근거 선택 · Decimal 계산 · 한영 금융 답변','Select evidence · Decimal arithmetic · Korean and English financial answers'],['답변과 당시 근거를 PostgreSQL에 저장합니다.','Answers and their supporting evidence are saved in PostgreSQL.']],
'raintoday':[['예보가 발표됐을 때','When a forecast is issued'],['그때의 예보를 보존','Preserve the forecast as issued'],['관측 결과가 나온 뒤','After observations arrive'],['보존한 예보와 관측을 비교','Compare the saved forecast with observations'],['자료가 없는 상태와 강수 확률 0%는 구분합니다.','Missing data and a zero rain probability are different states.']],
'glass-table':[['계산과 학습 로직','Calculation and learning logic'],['카드 계산 · 문제 생성 · 채점 · 복습','Card calculations · drills · grading · review'],['앱 화면','Application interface'],['SwiftUI · 기기 내 진행 기록','SwiftUI · progress stored on the device'],['계산과 학습 로직을 UI 밖에 두어 시뮬레이터 없이 검사합니다.','Logic outside the UI can be tested without a simulator.']]};const d=diagrams[p.id];return `<div class="system-flow"><div class="flow-branches"><section><strong>${pick(d[0])}</strong><p>${pick(d[1])}</p></section><section><strong>${pick(d[2])}</strong><p>${pick(d[3])}</p></section></div><p class="flow-result">${pick(d[4])}</p></div>`}
function detail(p){const related=data.find(x=>x.id===p.related)||data[(data.indexOf(p)+1)%data.length];return `<main id="main" class="detail"><a class="back" href="#projects">${t('프로젝트 목록으로','Back to projects')}</a><div class="detail-head"><p class="eyebrow">${pick(p.type)}</p><h1>${name(p)}</h1><p class="promise">${pick(p.promise)}</p><p class="description">${pick(p.desc)}</p>${projectLinks(p)}</div><div class="case-body"><p class="stack">${p.stack}</p><section class="chapter"><h2>${pick(caseQuestions[p.id][0])}</h2><p>${pick(p.problem)}</p></section>${p.id==='mammacare'?'':gallery(p)}${['role','decision','evidence'].map((key,i)=>`<section class="chapter"><h2>${pick(caseQuestions[p.id][i+1])}</h2><p>${pick(p[key])}</p>${key==='decision'?decisionVisual(p):''}${p.id==='mammacare'&&key==='role'?gallery(p):''}</section>`).join('')}<a class="next" href="#project/${related.id}"><span>${t(p.related?'연결된 프로젝트':'다음 프로젝트',p.related?'Related project':'Next project')}</span><strong>${name(related)}</strong></a></div></main>`}

function introduction(){return `<section id="about" class="hero combined-intro"><div><p class="eyebrow">${t('백엔드 개발자','Backend developer')}</p><h1>${t('AI와 데이터를 연결하는<br><span>백엔드 개발</span>','Backend development<br><span>with AI and data</span>')}</h1><p class="hero-support">${t('웹·모바일 앱을 위한 API와 데이터 처리 시스템을 만듭니다.','I build APIs and data systems for web and mobile apps.')}</p></div><div class="qualification-groups"><section><h2>${t('교육','Education')}</h2><div>${t('Microsoft 인공지능 SW 아카데미 3기','Microsoft AI Software Academy')}<br>The University of Texas at Austin</div></section><section><h2>${t('자격증','Certifications')}</h2><div>SQLD<br>Azure AI Fundamentals (AI-900)</div></section></div></section>`}

function render(mode){document.documentElement.lang=language?'en':'ko';const p=route();return `<div class="shell ${mode}">${nav()}${p?detail(p):`<main id="main">${introduction()}<section id="projects"><div class="sectionline"><h2>${t('프로젝트','Projects')}</h2></div>${data.map(row).join('')}</section></main>`}${footer()}</div>`}

document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;if(a.hasAttribute('data-language')){e.preventDefault();const y=scrollY;language=language?0:1;const u=new URL(location);u.pathname=language?'/en/':'/ko/';u.search='';history.replaceState(null,'',u);rerender();const toggle=document.querySelector('[data-language]');toggle.focus({preventScroll:true});window.scrollTo(0,y);if(e.detail>0&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelector('.nav-current').animate([{opacity:.4},{opacity:1}],{duration:180,easing:'cubic-bezier(.23,1,.32,1)'});return}if(a.hash&&a.origin===location.origin){if(a.hash.startsWith('#project/'))window.scrollTo(0,0);if(!a.hash.startsWith('#project/')&&route()){e.preventDefault();history.pushState(null,'',a.hash);rerender();requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById(a.hash.slice(1))?.scrollIntoView()))}}});
window.addEventListener('hashchange',()=>{rerender();requestAnimationFrame(()=>requestAnimationFrame(()=>{if(route()||location.hash==='#home')window.scrollTo(0,0);else document.getElementById(location.hash.slice(1))?.scrollIntoView()}))});
document.addEventListener('click',e=>{if(e.target.closest('a')?.getAttribute('href')==='#home')requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,0)))});
window.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement){const img=e.target;img.alt=t('이미지를 불러오지 못했습니다. 프로젝트 설명을 확인해 주세요.','Image unavailable. Please read the project description.')}},true);
