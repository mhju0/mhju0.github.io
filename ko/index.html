{id:'filing-digest',name:'Filing Digest',img:'digest',extra:'answer',kind:'phones',stack:'Python · FastAPI · PostgreSQL / pgvector · SwiftUI',type:['개인 프로젝트 · iOS + Backend','Personal project · iOS + backend'],promise:['공시 원문을 확인하며 투자 판단을 시작합니다.','Read company filings with the sources in view.'],desc:['한국과 미국 기업의 공시를 원문 근거와 함께 읽는 앱입니다. 재무 수치를 가져오는 과정과 AI 설명을 생성하는 과정을 분리했습니다.','An iOS app for reading Korean and US company filings. It handles reported financial figures separately from AI explanations.'],problem:['다른 사람의 투자 해석을 따라가기보다 기업이 공개한 숫자와 근거를 직접 확인하고 싶었습니다. 긴 공시에서 필요한 부분을 찾고, 설명의 출처까지 확인하는 흐름을 만들었습니다.','I wanted to check company disclosures directly rather than rely on someone else’s interpretation. The reader brings relevant passages, reported figures and their sources together.'],role:['공시 수집·정규화부터 검색과 답변 API, SwiftUI 화면까지 연결했습니다. DART·SEC의 서로 다른 자료를 저장하고 검색할 수 있는 백엔드를 구성했습니다.','I built the backend to collect, normalize and search filings from Korea\u0027s DART system and the US SEC, then connected the answer APIs to a SwiftUI app.'],decision:['재무 수치는 구조화 데이터에서 가져오고 AI 설명은 별도로 검사합니다. 일부 생성 오류나 인용·수치 검증 실패가 발생하면 설명을 제한하고 수치는 반환합니다.','Reported figures come from structured data. The app checks AI explanations separately. For certain generation errors or failed citation and number checks, it limits the explanation while still returning the figures.'],evidence:['공시 출처 연결과 답변의 실패 경계를 테스트했습니다. 모든 검색·DB 장애를 같은 방식으로 복구한다는 의미는 아닙니다. 공개 데모는 실제 앱을 캡처한 읽기 전용 워크스루입니다.','I tested source links and how answers behave when parts of generation fail. Database and search failures do not all use the same recovery path. The public demo is a read-only walkthrough of recorded app sessions.'],flow:[['공시 수집','DART · SEC'],['검색과 수치 조회','pgvector · 구조화 데이터'],['응답 조립','설명 검사 · 원문 연결']],related:'filing-agent',relation:['자매 프로젝트 · Filing Agent로 이어지는 공시 데이터 기반','Related project · Filing Agent builds on the filing-data work in Digest'],caption:['삼성전자 · 공시 원문 수치와 인용 답변','Samsung Electronics · filing figures and cited answer'],link:'https://mhju0.github.io/filing-digest/',code:'https://github.com/mhju0/filing-digest'},
{id:'filing-agent',name:'Filing Agent',img:'agent',stack:'Python · FastAPI · LangGraph · PostgreSQL · React',type:['개인 프로젝트 · Local AI + Web','Personal project · Local AI + web'],promise:['후속 질문에도 답변의 근거를 보존합니다.','Ask follow-up questions without losing the evidence.'],desc:['검증된 과거 공시 수치를 후속 질문으로 조회·비교하고, 답변과 당시 근거를 함께 저장하는 로컬 웹 앱입니다.','A web app that runs locally to look up and compare verified figures from past company filings. It saves each answer with the evidence used to produce it.'],problem:['공시 수치를 확인한 뒤에는 다른 연도와 비교하거나 회사를 바꾸어 질문하게 됩니다. 이때 회사·연도·지표의 맥락과 답변에 사용한 근거를 함께 보존하는 흐름을 구현했습니다.','A figure often leads to another question: a different year, or a different company. The application preserves that context and the evidence behind each saved answer.'],role:['React 화면, FastAPI API, LangGraph 작업 단계와 PostgreSQL 저장을 연결했습니다. Digest 자료 조사에서 출발해 원문과 대조한 별도 스냅샷을 사용합니다.','I connected the React interface, FastAPI endpoints, LangGraph stages and PostgreSQL storage. The application uses a separately verified snapshot developed from an audit of Digest’s data.'],decision:['모델 실험에서는 근거를 맞게 골라도 증가·감소 설명이 틀렸습니다. 모델에는 질문 의도 해석만 맡기고, 근거 선택·Decimal 계산·한영 금융 답변은 코드가 결정하도록 했습니다.','Model experiments produced incorrect increase/decrease descriptions even when evidence selection was correct. The model now interprets the question. Code selects the evidence, calculates with Decimal and writes the financial answer in Korean or English.'],evidence:['저장 결과 보존, 회사 전환, 확인 질문, 중단 단계 재시도를 검사했습니다. 현재는 정해진 회사·지표의 과거 스냅샷을 지원합니다. 공개 replay는 실제 실행 기록이며 자유 입력이나 실시간 공시 조회를 제공하지 않습니다.','I checked saved results, switching companies, clarification questions and retrying interrupted steps. The app uses a fixed historical snapshot for a defined set of companies and metrics. The public demo replays recorded sessions; it does not accept new questions or fetch current filings.'],flow:[['질문 해석','로컬 Gemma'],['근거와 계산','스냅샷 · Decimal'],['결과 보존','PostgreSQL · 재시도']],related:'filing-digest',relation:['자매 프로젝트 · Filing Digest의 자료 조사에서 대화형 비교로','Related project · Uses a verified snapshot developed from the Digest data audit'],caption:['실제 로컬 실행을 저장한 replay 화면','Recorded session from the app running locally'],link:'https://filing-agent.vercel.app/',code:'https://filing-agent.vercel.app/engineering-en.html'},
{id:'fullcourt',name:'FullCourt',img:'fullcourt',stack:'TypeScript · Next.js · PostgreSQL',type:['개인 프로젝트 · Web + Data','Personal project · Web + data'],promise:['두 팀이 얼마나 쉬고 만나는지 비교합니다.','Compare how much rest each team has had before a game.'],desc:['NBA 경기를 보기 전, 두 팀이 어떤 일정과 휴식을 거쳐 만나는지 살펴봅니다. 일정 데이터와 피로도·휴식 정보를 연결했습니다.','Compare two NBA teams\u0027 schedules, rest and fatigue indicators before they meet.'],problem:['경기 결과만큼 경기 전 일정이 궁금했습니다. 연속 경기와 휴식 차이를 여러 페이지에서 확인하는 대신 오늘의 일정에서 비교하고 싶었습니다.','I wanted to understand the schedule behind a matchup: consecutive games and differences in rest, alongside today’s games.'],role:['경기 일정 데이터와 계산 결과를 웹 화면에 연결하고, 일일 데이터 처리와 분석 기능을 구성했습니다.','I connected game schedules and derived indicators to the web interface and built daily data processing and analysis features.'],decision:['화면에서 휴식 조건과 경기 결과 예측을 구분합니다. 일정으로 계산한 지표의 의미를 설명하고, 예측 결과를 실제 경기 결과와 같은 정보로 취급하지 않습니다.','The interface distinguishes rest conditions from model predictions. Schedule-derived indicators and predicted results serve different purposes.'],evidence:['실제 경기 일정 화면을 보여줍니다. 이 포트폴리오에서는 예측 정확도나 운영 규모 수치를 제시하지 않으며, 일정 지표를 승패 보장으로 해석하지 않습니다.','The screenshot shows the schedule page. This portfolio includes no figures for prediction accuracy or service scale. Rest indicators do not guarantee a game\u0027s outcome.'],caption:['저장소에 보존된 일정 화면 · 캡처 당시 데이터','Repository schedule capture · data as shown at capture time'],link:'https://fullcourt-nba.vercel.app',code:'https://github.com/mhju0/fullcourt'},
{id:'raintoday',name:'오늘비',en:'Raintoday',img:'rain',stack:'TypeScript · Next.js · PostgreSQL',type:['개인 프로젝트 · Web + Data','Personal project · Web + data'],promise:['오늘 우산이 필요한지, 시간대별로.','Rain, hour by hour.'],desc:['여러 예보의 강수 확률과 관측 결과를 살펴보는 서비스입니다. 예보를 수집하는 일과 나중에 평가하는 일을 분리했습니다.','A weather app that compares rain forecasts from multiple providers with observations. It saves forecasts before evaluating them later.'],problem:['날씨를 화려하게 보여주는 구상에서 출발했지만, 실제로 알고 싶은 것은 언제 비가 올지였습니다. 비용과 핵심 질문을 다시 살피며 데이터 중심으로 방향을 바꿨습니다.','I started with an idea for cinematic weather visuals. After reconsidering the cost and what I wanted to know, I focused on the rain data.'],role:['지역별 예보 조회 화면과 외부 예보 데이터 처리, 관측 결과를 이용한 평가 흐름을 개발했습니다.','I developed the location-based forecast interface, provider-data processing and an evaluation flow using observations.'],decision:['예보가 발표됐을 때의 기록을 보존해야 이후 결과와 공정하게 비교할 수 있습니다. 자료가 없을 때와 강수 확률이 0일 때도 서로 다른 상태로 다룹니다.','A forecast must be preserved as issued to compare it with later observations. Missing data and a zero rain probability are distinct states.'],evidence:['화면은 저장된 실제 캡처이며 현재 날씨가 아닙니다. 제공자 상태에 따라 가용 범위가 달라집니다. 기상청보다 정확하다는 주장은 하지 않습니다.','The image is an existing application capture, not current weather. Coverage depends on provider availability. I have not established that it is more accurate than Korea\u0027s national weather service.'],caption:['저장소에 보존된 예보 화면 · 현재 날씨 아님','Repository forecast capture · not current weather'],link:'https://raintoday.vercel.app',code:'https://github.com/mhju0/raintoday'},
{id:'mammacare',name:'Mammacare',img:'mamma',stack:'FastAPI · PostgreSQL · Azure OpenAI · React · FCM',type:['팀 프로젝트 · 2026.05~06 · 백엔드 / 팀장','Team project · May to June 2026 · Backend / team lead'],promise:['팀을 이끌고, AI 식단 생성의 규칙을 설계했습니다.','I led the team and redesigned its AI meal-generation logic.'],desc:['이유식 관리 앱의 팀장으로 코드·PR 검토와 병합을 맡고, AI 식단 생성 로직을 재설계했습니다. JWT 인증·계정 관리와 알림 시스템을 구현했습니다.','I led the team building this baby-feeding app and reviewed and merged code changes. I redesigned its AI meal-generation logic and implemented JWT authentication, account management and notifications.'],problem:['팀에서 이유식과 음식에 대한 반응을 함께 기록하는 주제를 골랐습니다. 제 개인 육아 경험에서 출발한 아이디어는 아니었습니다. 보호자가 기록을 꾸준히 이어갈 수 있도록 구성했습니다.','The team chose a project that connects baby-feeding plans with records of reactions to food. We focused on helping caregivers keep those records over time. The idea came from the team\u0027s topic selection rather than my own parenting experience.'],role:['팀 일정·산출물과 코드·PR 검토 및 병합을 맡았습니다. Azure OpenAI 식단 생성에서 월령과 알레르기 테스트 상태에 따른 후보 필터링·프롬프트·출력 검증을 재설계했습니다. FastAPI·PostgreSQL 기반에서 JWT 인증, 소셜 계정 연결, 알림·웹푸시를 구현했습니다.','I coordinated the team\u0027s schedule and deliverables, reviewed pull requests and merged changes. For Azure OpenAI meal generation, I redesigned candidate filtering, prompts and output checks around the child\u0027s age and allergy-test status. I also implemented JWT authentication, social account linking and web push notifications with FastAPI and PostgreSQL.'],decision:['알림의 중복 방지와 AI 식단의 규칙 검증을 백엔드에서 다뤘습니다. 규칙으로 정해지는 식단은 모델을 호출하지 않는 경로로 처리했습니다.','The backend checks meal plans against rules and prevents duplicate notifications. When rules fully determine a meal plan, it generates the plan without calling the model.'],evidence:['2026년 5~6월 Azure 팀 프로젝트와 당시 발표 자료를 기준으로 합니다. 전체 팀 결과와 본인의 담당 기능을 구분하며, 의료적 진단 효과나 측정하지 않은 성능 향상을 주장하지 않습니다.','The scope is the May to June 2026 Azure team project. Team outcomes and my own responsibilities are distinguished. No diagnostic benefit or unmeasured performance improvement is claimed.'],related:'allergy-tracker',relation:['관련 프로젝트 · Allergy Tracker에서 개인 앱으로 재설계','Related project · Revisited as a personal app in Allergy Tracker'],caption:['2026.06.05 팀 중간발표 · 알림과 증상 기록 설명','June 5, 2026 team presentation · notifications and reaction records']},
{id:'allergy-tracker',name:'Allergy Tracker',img:'allergy',kind:'singlephone',stack:'React Native · Expo · TypeScript · SQLite',type:['개인 프로젝트 · Mobile','Personal project · Mobile'],promise:['먹어 본 재료와 반응을 차곡차곡.','A clear record of foods and reactions.'],desc:['Mammacare에서 다룬 음식과 반응 기록을 개인 모바일 앱으로 다시 만들었습니다. 계정이나 서버 동기화 없이 기기에 기록을 보관합니다.','A personal mobile app for recording foods and reactions, revisiting the problem explored in Mammacare. Records stay on the device, with no accounts or server sync.'],problem:['이유식 재료와 반응을 기록하는 도메인을 개인 앱으로 처음부터 다시 구성했습니다. 한 번의 입력보다 시간에 따라 이어지는 관찰과 기록의 상태를 다룹니다.','I rebuilt food and reaction tracking as a personal app, including how observations and record states change over time.'],role:['React Native·Expo 화면과 SQLite 저장, 재료·관찰 기록의 상태와 입력 규칙을 연결했습니다.','I connected the React Native and Expo interface to SQLite storage, observation state and input rules.'],decision:['기록에서 재료 상태를 계산하고 관찰 진행 규칙을 검사합니다. 서버 계정과 동기화를 두지 않아 데이터의 수명과 동작 범위를 기기 안으로 한정했습니다.','Food status is derived from records and observation rules are checked in code. The app has no accounts or server sync, so its data stays on the device.'],evidence:['화면은 기존 앱의 예시 기록입니다. 의료적 진단이나 알레르기 안전 보장이 아닌 기록 도구로 설명합니다. 플랫폼별 배포 상태는 이번 검토에서 확인하지 않았습니다.','The capture shows example records from the application. This is a recording tool, not a diagnosis or safety guarantee. Platform release status was not verified in this review.'],related:'mammacare',relation:['관련 프로젝트 · Mammacare와 이어지는 기록 도메인','Related project · Food and reaction tracking first explored in Mammacare'],caption:['기존 앱 화면 · 예시 기록','Existing application capture · example records'],code:'https://github.com/mhju0/allergy-tracker'},
{id:'stock-game',name:'Stock Game',img:'stock',stack:'FastAPI · PostgreSQL · React',type:['개인 프로젝트 · Web + Backend','Personal project · Web + backend'],promise:['주문 처리와 잔고 변경을 함께 다룹니다.','Handle orders and balance updates together.'],desc:['한국·미국 주식 모의투자 서비스입니다. 주문, 잔고, 인증과 거래 후 기록이 만나는 지점을 다뤘습니다.','A paper-trading application for Korean and US stocks, covering orders, balances, authentication and post-trade records.'],problem:['모의투자에서도 주문이 반영되는 시점과 잔고가 바뀌는 규칙은 일관되어야 합니다. 거래 처리와 그 뒤에 발생하는 기록 작업의 경계를 살폈습니다.','Even in paper trading, order execution and balance changes need consistent rules. The project examines the boundary between trades and subsequent recording tasks.'],role:['거래 처리와 인증, 잔고 및 세션 관리 기능을 개발하고 웹 화면과 연결했습니다.','I developed trading, authentication, balance and session management and connected them to the web interface.'],decision:['거래 규칙을 공통 로직으로 모으고 트랜잭션과 후속 스냅샷 작업을 구분했습니다. 거래가 끝난 뒤 기록 작업이 실패했을 때 같은 주문을 다시 실행하는 문제를 살폈습니다.','I consolidated trading rules into shared logic and separated the trade transaction from the snapshot saved afterward. I examined what happens when that later step fails, including the risk of executing the same order again.'],evidence:['실제 자금 거래가 아닌 모의투자입니다. SQLite 테스트 결과를 PostgreSQL 동시 주문 검증으로 확대하지 않으며, 전체 금액 경로가 Decimal이라는 주장도 하지 않습니다.','Trades use simulated money. The SQLite tests do not verify concurrent orders in PostgreSQL. This review also does not establish that Decimal is used throughout all monetary calculations.'],caption:['저장소에 보존된 모의투자 화면','Repository paper-trading capture'],link:'https://stock-game-gray.vercel.app',code:'https://github.com/mhju0/stock-game'}
];

const t=(ko,en)=>language?en:ko;const pick=a=>a[language];const name=p=>language&&p.en?p.en:p.name;const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function route(){return location.hash.startsWith('#project/')?data.find(p=>p.id===location.hash.slice(9)):null}

 const u=new URL(location);u.pathname=language?'/ko/':'/en/';u.search='';
 return `<header class="site-nav"><a class="name" href="#home">${t('주민현','Michael Ju')}</a><nav class="navlinks" aria-label="${t('주 메뉴','Main navigation')}"><a class="navbutton" href="#projects">${t('프로젝트','Projects')}</a><a class="navbutton" href="#about">${t('소개','About')}</a><div class="language-switch" role="group" aria-label="${t('언어','Language')}"><span aria-current="true">${language?'EN':'KO'}</span><a href="${u.href}" class="lang" data-language aria-label="${t('Read in English','한국어로 보기')}">${language?'KO':'EN'}</a></div></nav></header>`;
}
function footer(){return `<footer><span>${t('주민현 · AI·데이터 애플리케이션 경험을 가진 백엔드 개발자','Michael Ju · Backend development, AI and data applications')}</span><a href="https://github.com/mhju0" target="_blank" rel="noreferrer">GitHub</a></footer>`}
function row(p,i){return `<article class="project" id="p-${p.id}"><div>${imageBlock(p)}<p class="caption">${pick(p.caption)}</p></div><div><p class="number">${String(i+1).padStart(2,'0')} / ${pick(p.type)}</p><h3><a href="#project/${p.id}">${name(p)}</a></h3><p class="promise">${pick(p.promise)}</p><p class="description">${pick(p.desc)}</p><p class="stack">${p.stack}</p>${p.relation?`<p class="relation">${pick(p.relation)}</p>`:''}<a class="read" href="#project/${p.id}">${t('설계와 구현 읽기','Read about the project')}</a></div></article>`}
function detail(p){const related=data.find(x=>x.id===p.related)||data[(data.indexOf(p)+1)%data.length];return `<main id="main" class="detail"><a class="back" href="#projects">${t('프로젝트 목록으로','Back to projects')}</a><div class="detail-head"><p class="eyebrow">${pick(p.type)}</p><h1>${name(p)}</h1><p class="promise">${pick(p.promise)}</p><p class="description">${pick(p.desc)}</p></div>${imageBlock(p,false)}<p class="caption">${pick(p.caption)}</p><div class="detail-meta"><span>${p.stack}</span><span>${t('프로젝트 상세','Project details')}</span></div><div class="detail-body">${[['문제와 출발점','The problem','problem'],['내가 구현한 부분','My contribution','role'],['중요한 설계 선택','Design choices','decision'],['확인한 것과 남은 한계','Evidence and limitations','evidence']].map(([ko,en,key],i)=>`<section class="chapter"><h2>${t(ko,en)}</h2><p>${pick(p[key])}</p>${key==='decision'&&p.flow?`<div class="flow" aria-label="${t('실행 흐름','Execution flow')}">${p.flow.map((f,j)=>`<div><small>${j+1}</small>${language?([p.id==='filing-agent'?'Interpret intent':'Ingest filings',p.id==='filing-agent'?'Select evidence and calculate':'Retrieve passages and figures',p.id==='filing-agent'?'Save the result':'Check and assemble the answer'][j]):f[0]}<br><span>${language?(['','', ''][j]):f[1]}</span></div>`).join('')}</div>`:''}</section>`).join('')}<div class="links">${p.link?`<a href="${p.link}" target="_blank" rel="noreferrer">${t(p.id.startsWith('filing-')?'기록된 데모 보기':'서비스 열기',p.id.startsWith('filing-')?'Open recorded demo':'Open application')}</a>`:''}${p.code?`<a href="${p.code}" target="_blank" rel="noreferrer">${t(p.id==='filing-agent'?'공개 기술 소개와 소스':'GitHub 코드',p.id==='filing-agent'?'Engineering notes and source':'Source on GitHub')}</a>`:''}</div><a class="next" href="#project/${related.id}"><span>${t(p.related?'연결해서 읽기':'다음 프로젝트',p.related?'Related project':'Next project')}</span><strong>${name(related)}</strong></a></div></main>`}
function render(mode){document.documentElement.lang=language?'en':'ko';const p=route();return `<div class="shell ${mode}">${nav()}${p?detail(p):`<main id="main"><section class="hero"><div class="eyebrow">${t('AI·데이터 애플리케이션 경험을 가진 백엔드 개발자','Backend developer with experience building AI and data applications')}</div><h1>${copy[copyChoice][language][0]}</h1><p>${copy[copyChoice][language][1]}</p></section><section id="projects"><div class="sectionline"><h2>${t('프로젝트','Projects')}</h2><p>${t('문제에서 시작해, 설계와 검증까지','From the problem to design and verification')}</p></div><div class="workgrid"><nav class="indexnav" aria-label="${t('프로젝트 목차','Project index')}">${data.map((p,i)=>`<a href="#p-${p.id}">${String(i+1).padStart(2,'0')}　${name(p)}</a>`).join('')}</nav><div>${data.map(row).join('')}</div></div></section><section class="about" id="about"><h2>${t('소개와 배경','About & background')}</h2><div><p>${t('개인 프로젝트에서는 데이터 수집부터 API와 화면까지 구현했습니다. 팀 프로젝트에서는 팀을 이끌며 AI 식단 생성과 인증 시스템을 맡았습니다. 각 프로젝트에 설계 이유와 구현의 한계를 함께 적었습니다.','My personal projects connect data collection, APIs and user interfaces. In a team project, I led development and worked on AI meal generation and authentication. Each project explains my design choices and the limits of what I built.')}</p><div class="credentials">Python · TypeScript · SQL<br><br>${t('Microsoft 인공지능 SW 아카데미 · 3기','Microsoft AI Software Academy')}<br>The University of Texas at Austin<br><br>${t('SQLD · Azure AI Fundamentals (AI-900)','SQLD (SQL developer certification, Korea) · Azure AI Fundamentals (AI-900)')}<br>${t('한국어 · 영어','Korean · English')}</div></div></section></main>`}${footer()}</div>`}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;if(a.hasAttribute('data-language')){e.preventDefault();const y=scrollY;language=language?0:1;const u=new URL(location);u.pathname=language?'/en/':'/ko/';u.search='';history.replaceState(null,'',u);rerender();const toggle=document.querySelector('[data-language]');toggle.focus({preventScroll:true});window.scrollTo(0,y);if(e.detail>0&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelector('.language-switch [aria-current]').animate([{opacity:.4},{opacity:1}],{duration:180,easing:'cubic-bezier(.23,1,.32,1)'});return}if(a.hash&&a.origin===location.origin){if(a.hash.startsWith('#project/'))window.scrollTo(0,0);if(!a.hash.startsWith('#project/')&&route()){e.preventDefault();history.pushState(null,'',a.hash);rerender();requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById(a.hash.slice(1))?.scrollIntoView()))}}});
window.addEventListener('hashchange',()=>{rerender();requestAnimationFrame(()=>requestAnimationFrame(()=>{if(route()||location.hash==='#home')window.scrollTo(0,0);else document.getElementById(location.hash.slice(1))?.scrollIntoView()}))});
document.addEventListener('click',e=>{if(e.target.closest('a')?.getAttribute('href')==='#home')requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,0)))});
window.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement){const img=e.target;img.alt=t('이미지를 불러오지 못했습니다. 프로젝트 설명을 확인해 주세요.','Image unavailable. Please read the project description.')}},true);

data.push({id:'glass-table',name:'Glass Table',img:'glass',kind:'singlephone',stack:'Swift · SwiftUI · Swift Package Manager',type:['개인 프로젝트 · iOS','Personal project · iOS'],

caption:['저장소에 보존된 iOS 훈련 화면','Repository capture of the iOS trainer'],code:'https://github.com/mhju0/glass-table'});
