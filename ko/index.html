{id:'filing-digest',name:'Filing Digest',img:'digest',extra:'answer',kind:'phones',stack:'Python · FastAPI · PostgreSQL (pgvector) · SwiftUI',type:['개인 프로젝트 · iOS + Backend','Personal project · iOS + backend'],promise:['공시 원문을 확인하며 투자 판단을 시작합니다.','Read company filings with the sources in view.'],desc:['한국과 미국 기업의 공시를 원문 근거와 함께 읽는 앱입니다. 재무 수치를 가져오는 과정과 AI 설명을 생성하는 과정을 분리했습니다.','An iOS app for reading Korean and US company filings. It handles reported financial figures separately from AI explanations.'],problem:['다른 사람의 투자 해석을 따라가기보다 기업이 공개한 숫자와 근거를 직접 확인하고 싶었습니다. 긴 공시에서 필요한 부분을 찾고, 설명의 출처까지 확인하는 흐름을 만들었습니다.','I wanted to check company disclosures directly rather than rely on someone else’s interpretation. The reader brings relevant passages, reported figures and their sources together.'],role:["DART·SEC 공시의 수집·정규화, 검색·답변 API와 한영 SwiftUI 화면을 연결했습니다. 최근에는 브라우저 요청의 출처를 DB·모델 호출 전에 검사하고, 공시가 없거나 설명이 차단된 화면의 안내를 보강했습니다.", "I connected DART and SEC ingestion, normalization, retrieval and answer APIs to a bilingual SwiftUI reader. Recent work checks browser origins before database or model dependencies and clarifies empty and blocked states."],decision:['재무 수치는 구조화 데이터에서 가져오고 AI 설명은 별도로 검사합니다. 일부 생성 오류나 인용·수치 검증 실패가 발생하면 설명을 제한하고 수치는 반환합니다.','Reported figures come from structured data. The app checks AI explanations separately. For certain generation errors or failed citation and number checks, it limits the explanation while still returning the figures.'],evidence:["18개사 범위는 9월 9일 로컬 검증 기록입니다. 9월 16일 소스 대조에서 API v0.4·DB 스키마 v0.3과 수치·설명 분리 구조가 유지됨을 확인했습니다. 인용·수치 검사는 모든 문장의 의미적 정확성을 증명하지 않습니다. 공개 페이지는 API를 호출하지 않는 읽기 전용 워크스루입니다.", "Coverage of 18 companies comes from the September 9 local qualification. The September 16 source review confirms API v0.4, schema v0.3 and the separation of figures from narrative remain in place. Citation and number checks do not prove every sentence is semantically supported. The public walkthrough is read-only and makes no API calls."],flow:[['공시 수집','DART · SEC'],['검색과 수치 조회','pgvector · 구조화 데이터'],['응답 조립','설명 검사 · 원문 연결']],related:'filing-agent',relation:['자매 프로젝트 · Filing Agent로 이어지는 공시 데이터 기반','Related project · Filing Agent builds on the filing-data work in Digest'],caption:['삼성전자 · 요약 화면 (UI 테스트 예시 데이터)와 인용 답변','Samsung Electronics · filing figures and cited answer'],link:'https://mhju0.github.io/filing-digest/',code:'https://github.com/mhju0/filing-digest'},
{id:'filing-agent',name:'Filing Agent',img:'agent',stack:'Python · FastAPI · LangGraph · PostgreSQL · React',type:['개인 프로젝트 · Local AI + Web','Personal project · Local AI + web'],promise:['후속 질문에도 답변의 근거를 보존합니다.','Ask follow-up questions without losing the evidence.'],desc:["검증된 과거 공시 수치를 후속 질문으로 조회·비교하는 로컬 웹 앱입니다. 회사·연도·지표의 맥락을 이어가고 답변과 당시 근거를 함께 저장합니다.", "A local web app for comparing verified historical filing figures through follow-up questions. It carries company, fiscal-year and metric context forward and saves each answer with its evidence."],problem:['공시 수치를 확인한 뒤에는 다른 연도와 비교하거나 회사를 바꾸어 질문하게 됩니다. 이때 회사·연도·지표의 맥락과 답변에 사용한 근거를 함께 보존하는 흐름을 구현했습니다.','A figure often leads to another question: a different year, or a different company. The application preserves that context and the evidence behind each saved answer.'],role:["React 화면, FastAPI API, LangGraph 작업 단계와 PostgreSQL 저장을 연결했습니다. 자연스러운 후속 질문과 상대 연도를 처리하며, 지원하지 않는 회사나 범위가 섞이면 임의로 줄여 답하지 않고 확인을 요청합니다.", "I connected React, FastAPI, LangGraph stages and PostgreSQL storage. Follow-ups support relative fiscal years within a bounded grammar; unsupported companies or scope trigger clarification instead of a silently narrowed answer."],decision:['모델 실험에서는 근거를 맞게 골라도 증가·감소 설명이 틀렸습니다. 모델에는 질문 의도 해석만 맡기고, 근거 선택·Decimal 계산·한영 금융 답변은 코드가 결정하도록 했습니다.','Model experiments produced incorrect increase/decrease descriptions even when evidence selection was correct. The model now interprets the question. Code selects the evidence, calculates with Decimal and writes the financial answer in Korean or English.'],evidence:["9월 11일 검증 기록에는 정책 검사 57개·앱 검사 19개와 새 한영 모델 시나리오 각 20개 통과가 남아 있습니다. 9월 16일에는 현재 소스와 기록을 대조했으며 모델 평가는 다시 실행하지 않았습니다. 고정된 과거 스냅샷을 쓰며, 공개 replay는 실제 실행 기록입니다. 자유 입력과 실시간 공시 조회는 제공하지 않습니다.", "The September 11 record reports 57 policy tests, 19 app tests and one fresh trial of 20 Korean and 20 English model scenarios passing. I checked current source and records on September 16 without rerunning the model evaluation. The app uses a fixed historical snapshot; the public replay shows recorded runs and does not accept new questions or fetch current filings."],flow:[['질문 해석','로컬 Gemma'],['근거와 계산','스냅샷 · Decimal'],['결과 보존','PostgreSQL · 재시도']],related:'filing-digest',relation:['자매 프로젝트 · Filing Digest의 자료 조사에서 대화형 비교로','Related project · Uses a verified snapshot developed from the Digest data audit'],caption:['실제 로컬 실행을 저장한 replay 화면','Recorded session from the app running locally'],link:'https://filing-agent.vercel.app/',code:'https://github.com/mhju0/filing-agent'},
{id:'fullcourt',name:'FullCourt',img:'fullcourt',stack:'TypeScript · Next.js · PostgreSQL',type:['개인 프로젝트 · Web + Data','Personal project · Web + data'],promise:['두 팀이 얼마나 쉬고 만나는지 비교합니다.','Compare how much rest each team has had before a game.'],desc:["NBA 두 팀의 휴식과 일정 부담을 비교하고, 과거 경기의 홈·원정 기준선과 원문이 연결된 연구 결과를 살펴보는 서비스입니다.", "Compare NBA teams’ rest and schedule load, then inspect historical home/away baselines and research linked to its sources."],problem:['NBA를 좋아해서 시작한 프로젝트입니다. 경기를 보기 전, 두 팀이 얼마나 쉬고 만나는지가 궁금했습니다. 연속 경기와 휴식 차이를 여러 페이지에서 찾는 대신 한곳에서 비교하고 싶었습니다.','I built FullCourt out of my interest in the NBA. Before a game, I wanted to see how much rest each team had and whether either was playing consecutive games, without checking several pages.'],role:["일정 수집·계산과 일일 처리 파이프라인을 웹 화면에 연결했습니다. 12개 정규시즌 L2M 자료에 더해 홈코트 우위 연구와 시즌별 기준선을 추가하고, 자료의 범위·갱신 상태 및 연구 공개 여부를 구분했습니다.", "I connected schedule collection and calculations to the web app and daily pipeline. Alongside L2M reports from 12 regular seasons, I added home-court research, season baselines and explicit data coverage, freshness and publication states."],decision:['화면에서 휴식 조건과 경기 결과 예측을 구분합니다. 일정으로 계산한 지표의 의미를 설명하고, 예측 결과를 실제 경기 결과와 같은 정보로 취급하지 않습니다.','The interface distinguishes rest conditions from model predictions. Schedule-derived indicators and predicted results serve different purposes.'],evidence:["9월 11일 홈코트 연구 기록은 41개 시즌의 적격 경기 47,143건을 분석합니다. 이는 연구 표본 수이며 서비스 이용 규모가 아닙니다. 일정 지표는 승패를 보장하지 않고, L2M은 선택된 접전 경기 후반만 다룹니다. 9월 16일에는 로컬 소스와 연구 기록을 확인했으며 배포 상태를 다시 검증하지 않았습니다.", "The September 11 home-court study records 47,143 eligible games across 41 seasons. This is a research sample, not service usage. Schedule indicators do not guarantee results, and L2M covers selected close-game endings. The September 16 review checked local source and research records without reverifying deployment."],caption:['저장소에 보존된 일정 화면 · 캡처 당시 데이터','Repository schedule capture · data as shown at capture time'],link:'https://fullcourt-nba.vercel.app',code:'https://github.com/mhju0/fullcourt'},
{id:'raintoday',name:'Raintoday',en:'Raintoday',img:'rain',stack:'TypeScript · Next.js · PostgreSQL',type:['개인 프로젝트 · Web + Data','Personal project · Web + data'],promise:['오늘 우산이 필요한지, 시간대별로.','Rain, hour by hour.'],desc:['여러 예보의 강수 확률과 관측 결과를 살펴보는 서비스입니다. 예보를 수집하는 일과 나중에 평가하는 일을 분리했습니다.','A weather app that compares rain forecasts from multiple providers with observations. It saves forecasts before evaluating them later.'],problem:['날씨를 화려하게 보여주는 구상에서 출발했지만, 실제로 알고 싶은 것은 언제 비가 올지였습니다. 비용과 핵심 질문을 다시 살피며 데이터 중심으로 방향을 바꿨습니다.','I started with an idea for cinematic weather visuals. After reconsidering the cost and what I wanted to know, I focused on the rain data.'],role:["지역별 예보 화면과 예보 수집·관측 평가 흐름을 개발했습니다. 수집 실패에는 제한된 재시도와 새로운 실행 환경을 사용하고, 마지막 판정에서 필수 제공자와 저장 결과를 확인하도록 보강했습니다.", "I built the location-based forecast view and forecast-versus-observation pipeline. Collection recovery uses bounded retries and fresh runners, with a final verdict that checks required providers and stored results."],decision:["발표 당시의 예보는 그대로 보존하고, 일부 수집 실패만 조건과 대기 시간을 둔 재시도로 보완합니다. 과거 예보를 나중 값으로 채우지 않으며, 재시도 완료와 전체 수집 성공을 구분합니다. 자료 없음과 강수 확률 0%도 다른 상태로 다룹니다.", "Forecasts remain immutable. Eligible partial collection failures get a bounded retry after a cooldown; later values cannot backfill historical forecasts. Finishing a retry is distinct from passing the overall collection verdict, and missing data is distinct from zero rain probability."],evidence:["9월 16일 로컬 소스에서 최대 세 번의 새 실행 환경 시도와 조건부 부분 실패 재시도를 확인했습니다. 이는 복구 기회를 늘리는 장치이며 외부 API 장애가 해결됐다는 증거가 아닙니다. 기존 화면 캡처는 현재 날씨가 아니며, 예보 정확도 우위도 주장하지 않습니다.", "The September 16 source review confirms up to three fresh-runner attempts and an eligible partial-failure retry. These add recovery opportunities; they do not prove that upstream outages are resolved. The existing screenshot is not current weather, and no forecasting-accuracy advantage is claimed."],caption:['저장소에 보존된 예보 화면 · 현재 날씨 아님','Repository forecast capture · not current weather'],link:'https://raintoday.vercel.app',code:'https://github.com/mhju0/raintoday'},
{id:'mammacare',name:'Mammacare',img:'mamma',stack:'FastAPI · PostgreSQL · Azure OpenAI · React · FCM',type:['팀 프로젝트 · 백엔드 / 팀장','Team project · Backend / team lead'],promise:['이유식 식단과 음식 반응을 함께 기록합니다.','Meal planning and food reaction records for babies.'],desc:['이유식 식단과 음식 반응을 기록하는 앱입니다. 팀장으로 코드 검토와 병합을 맡고, AI 식단 생성과 인증·알림을 구현했습니다.','A baby-feeding app for meal plans and food reactions. I led the team and built meal-generation, authentication and notification features.'],problem:['팀에서 이유식과 음식에 대한 반응을 함께 기록하는 주제를 골랐습니다. 제 개인 육아 경험에서 출발한 아이디어는 아니었습니다. 보호자가 기록을 꾸준히 이어갈 수 있도록 구성했습니다.','The team chose a project that connects baby-feeding plans with records of reactions to food. We focused on helping caregivers keep those records over time. The idea came from the team\u0027s topic selection rather than my own parenting experience.'],role:['팀 일정·산출물과 코드·PR 검토 및 병합을 맡았습니다. Azure OpenAI 식단 생성에서 월령과 알레르기 테스트 상태에 따른 후보 필터링·프롬프트·출력 검증을 재설계했습니다. FastAPI·PostgreSQL 기반에서 JWT 인증, 소셜 계정 연결, 알림·웹푸시를 구현했습니다.','I coordinated the team\u0027s schedule and deliverables, reviewed pull requests and merged changes. For Azure OpenAI meal generation, I redesigned candidate filtering, prompts and output checks around the child\u0027s age and allergy-test status. I also implemented JWT authentication, social account linking and web push notifications with FastAPI and PostgreSQL.'],decision:['알림의 중복 방지와 AI 식단의 규칙 검증을 백엔드에서 다뤘습니다. 규칙으로 정해지는 식단은 모델을 호출하지 않는 경로로 처리했습니다.','The backend checks meal plans against rules and prevents duplicate notifications. When rules fully determine a meal plan, it generates the plan without calling the model.'],evidence:['2026년 5~6월 Azure 팀 프로젝트와 당시 발표 자료를 기준으로 합니다. 전체 팀 결과와 본인의 담당 기능을 구분하며, 의료적 진단 효과나 측정하지 않은 성능 향상을 주장하지 않습니다.','The scope is the May to June 2026 Azure team project. Team outcomes and my own responsibilities are distinguished. No diagnostic benefit or unmeasured performance improvement is claimed.'],related:'allergy-tracker',relation:['관련 프로젝트 · Allergy Tracker에서 개인 앱으로 재설계','Related project · Revisited as a personal app in Allergy Tracker'],caption:['2026.06.05 팀 중간발표 · 알림과 증상 기록 설명','June 5, 2026 team presentation · notifications and reaction records']},
{id:'allergy-tracker',name:'Allergy Tracker',img:'allergy',kind:'singlephone',stack:'React Native · Expo · TypeScript · SQLite',type:['개인 프로젝트 · Mobile','Personal project · Mobile'],promise:['먹어 본 재료와 반응을 차곡차곡.','A clear record of foods and reactions.'],desc:['Mammacare에서 다룬 음식과 반응 기록을 개인 모바일 앱으로 다시 만들었습니다. 계정이나 서버 동기화 없이 기기에 기록을 보관합니다.','A personal mobile app for recording foods and reactions, revisiting the problem explored in Mammacare. Records stay on the device, with no accounts or server sync.'],problem:['이유식 재료와 반응을 기록하는 도메인을 개인 앱으로 처음부터 다시 구성했습니다. 한 번의 입력보다 시간에 따라 이어지는 관찰과 기록의 상태를 다룹니다.','I rebuilt food and reaction tracking as a personal app, including how observations and record states change over time.'],role:['React Native·Expo 화면과 SQLite 저장, 재료·관찰 기록의 상태와 입력 규칙을 연결했습니다.','I connected the React Native and Expo interface to SQLite storage, observation state and input rules.'],decision:['기록에서 재료 상태를 계산하고 관찰 진행 규칙을 검사합니다. 서버 계정과 동기화를 두지 않아 데이터의 수명과 동작 범위를 기기 안으로 한정했습니다.','Food status is derived from records and observation rules are checked in code. The app has no accounts or server sync, so its data stays on the device.'],evidence:['화면은 기존 앱의 예시 기록입니다. 의료적 진단이나 알레르기 안전 보장이 아닌 기록 도구로 설명합니다. 플랫폼별 배포 상태는 이번 검토에서 확인하지 않았습니다.','The capture shows example records from the application. This is a recording tool, not a diagnosis or safety guarantee. Platform release status was not verified in this review.'],related:'mammacare',relation:['관련 프로젝트 · Mammacare와 이어지는 기록 도메인','Related project · Food and reaction tracking first explored in Mammacare'],caption:['기존 앱 화면 · 예시 기록','Existing application capture · example records'],code:'https://github.com/mhju0/allergy-tracker'},
{id:'stock-game',name:'Stock Game',img:'stock',stack:'FastAPI · PostgreSQL · React',type:['개인 프로젝트 · Web + Backend','Personal project · Web + backend'],promise:['주문 처리와 잔고 변경을 함께 다룹니다.','Handle orders and balance updates together.'],desc:['한국·미국 주식 모의투자 서비스입니다. 주문, 잔고, 인증과 거래 후 기록이 만나는 지점을 다뤘습니다.','A paper-trading application for Korean and US stocks, covering orders, balances, authentication and post-trade records.'],problem:['모의투자에서도 주문이 반영되는 시점과 잔고가 바뀌는 규칙은 일관되어야 합니다. 거래 처리와 그 뒤에 발생하는 기록 작업의 경계를 살폈습니다.','Even in paper trading, order execution and balance changes need consistent rules. The project examines the boundary between trades and subsequent recording tasks.'],role:['거래 처리와 인증, 잔고 및 세션 관리 기능을 개발하고 웹 화면과 연결했습니다.','I developed trading, authentication, balance and session management and connected them to the web interface.'],decision:['거래 규칙을 공통 로직으로 모으고 트랜잭션과 후속 스냅샷 작업을 구분했습니다. 거래가 끝난 뒤 기록 작업이 실패했을 때 같은 주문을 다시 실행하는 문제를 살폈습니다.','I consolidated trading rules into shared logic and separated the trade transaction from the snapshot saved afterward. I examined what happens when that later step fails, including the risk of executing the same order again.'],evidence:['실제 자금 거래가 아닌 모의투자입니다. SQLite 테스트 결과를 PostgreSQL 동시 주문 검증으로 확대하지 않으며, 전체 금액 경로가 Decimal이라는 주장도 하지 않습니다.','Trades use simulated money. The SQLite tests do not verify concurrent orders in PostgreSQL. This review also does not establish that Decimal is used throughout all monetary calculations.'],caption:['저장소에 보존된 모의투자 화면','Repository paper-trading capture'],link:'https://stock-game-gray.vercel.app',code:'https://github.com/mhju0/stock-game'}
];

const params=new URLSearchParams(location.search);let language=location.pathname.includes('/en/')?1:0;let copyChoice=params.get('copy')==='engineering'?'engineering':'interest';
const copy={interest:[['관심에서 출발한,<br><span>직접 쓰는 소프트웨어</span>','기업 공시, 경기 사이의 휴식, 시간대별 비 예보처럼 궁금한 주제를 데이터와 백엔드로 다룹니다.'],['Turning my interests<br><span>into practical software</span>','I build backend systems to explore questions about company filings, rest between games, and hourly rain forecasts.']],engineering:[['서비스를 구현하고,<br><span>그 동작을 검증합니다.</span>','AI가 맡을 일과 코드가 책임질 일을 나누고, 데이터와 근거를 확인할 수 있는 서비스를 만듭니다.'],['Build the service.<br><span>Verify how it works.</span>','I separate the work assigned to AI from the rules owned by code, building services with inspectable data and evidence.']]};
const t=(ko,en)=>language?en:ko;const pick=a=>a[language];const name=p=>language&&p.en?p.en:p.name;const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function route(){return location.hash.startsWith('#project/')?data.find(p=>p.id===location.hash.slice(9)):null}
function imageBlock(p,linked=true){const body=`<img loading="${linked?'lazy':'eager'}" decoding="async" src="${assets[p.img]}" alt="${escapeHtml(name(p)+' · '+pick(p.caption))}">${p.extra?`<img loading="${linked?'lazy':'eager'}" decoding="async" src="${assets[p.extra]}" alt="${t('Filing Digest 인용 답변 화면','Filing Digest cited answer screen')}">`:''}`;return linked?`<a class="visual ${p.kind||''}" href="#project/${p.id}" aria-label="${escapeHtml(name(p))} ${t('상세 읽기','project details')}">${body}</a>`:`<div class="visual ${p.kind||''}">${body}</div>`}
function nav(){
 const languageItem=(code,label)=>{
  if((language?'en':'ko')===code)return `<span class="navbutton nav-current" aria-current="true" lang="${code}">${label}</span>`;
  const u=location.protocol==='file:'?new URL((location.pathname.endsWith('/ko/index.html')||location.pathname.endsWith('/en/index.html')?'../':'')+code+'/index.html',location.href):new URL('/'+code+'/',location.href);u.search='';
  return `<a class="navbutton" href="${u.href}" data-language lang="${code}" aria-label="${code==='en'?'Read in English':'한국어로 보기'}">${label}</a>`;
 };
 return `<header class="site-nav"><a class="name" href="#home">${t('주민현','Michael Ju')}</a><nav class="navlinks" aria-label="${t('주 메뉴','Main navigation')}"><a class="navbutton" href="#about">${t('소개','ABOUT')}</a><a class="navbutton" href="#projects">${t('프로젝트','PROJECTS')}</a>${languageItem('ko','KO')}${languageItem('en','EN')}</nav></header>`;
}

const conciseDetails={"filing-digest":{"intro":["한국과 미국 기업의 공시에서 주요 수치를 살펴보고, 원문을 열어 확인할 수 있습니다. 수치와 설명을 함께 보며 기업의 실적을 이해할 수 있도록 만들었습니다.","Explore key figures from Korean and US company filings, then check the original sources. Figures and explanations sit together to help you understand a company’s performance."],"badge":["읽기 전용 데모","Read-only walkthrough"],"note":["공개 데모는 저장된 예시를 보여주며 실제 API를 호출하지 않습니다.","The public walkthrough shows saved examples without calling the API."],"points":[["Python·FastAPI 백엔드와 SwiftUI iPhone 앱","A Python/FastAPI backend with a SwiftUI iPhone app"],["공시의 수치는 구조화된 데이터에서 가져오고, AI가 작성하는 설명과 구분합니다","Financial figures come from structured data, separately from AI-generated explanations"],["생성된 설명의 인용과 수치를 검사하고, 검증에 실패하면 설명을 제한합니다","Generated explanations are checked for citations and numerical consistency, and limited when validation fails"]]},"filing-agent":{"intro":["기업 공시의 수치를 질문하고, 이어서 다른 연도나 기업과 비교할 수 있습니다. 답변에 사용한 수치와 원문 근거를 함께 확인할 수 있도록 만들었습니다.","Ask questions about company filings, then follow up with comparisons across years or companies. Each answer keeps the supporting figures and original sources in view."],"badge":["녹화 데모","Recorded demo"],"note":["검증된 과거 공시 자료를 사용하는 로컬 앱의 녹화 데모입니다.","A recorded demo of a local app using verified historical filing data."],"points":[["Python·FastAPI·PostgreSQL","Python · FastAPI · PostgreSQL"],["AI는 질문을 해석하고, 코드가 근거 선택과 수치 계산을 담당합니다","AI interprets the question; code selects the evidence and calculates the figures"],["답변과 근거를 저장해 이전 조사 내용을 다시 확인할 수 있습니다","Answers and supporting evidence are saved so you can revisit earlier research"]]},"fullcourt":{"intro":["NBA 경기 전, 두 팀이 얼마나 쉬고 얼마나 이동했는지 비교합니다. 경기 일정만으로는 잘 보이지 않는 휴식과 이동 부담을 살펴볼 수 있습니다.","One team played last night. The other has had a few days off. FullCourt compares rest and travel before NBA games, giving you a little more context before tip-off."],"points":[["경기 일정을 바탕으로 팀별 휴식일과 도시 간 이동 거리를 계산합니다","Uses game schedules to calculate rest days and travel distances between cities"]]},"raintoday":{"intro":["날씨 앱마다 비 예보가 달라서, 어떤 예보를 믿으면 좋을지 궁금했습니다. 5개 서비스의 예보를 모아 비교하고, 최근 예보 성적을 반영해 내일의 강수 예보를 조합합니다.","I wanted to know which rain forecast to trust when weather apps disagree. Raintoday compares forecasts from five providers and uses recent forecast performance to help combine tomorrow’s rain forecast."],"points":[["TypeScript·Next.js로 만든 웹서비스","A web service built with TypeScript and Next.js"],["발표 당시의 예보를 저장하고, 나중에 실제 관측과 비교합니다","Saves forecasts as issued, then compares them with observations later"]]},"allergy-tracker":{"intro":["팀 프로젝트 Mammacare를 음식과 알레르기 반응을 간편하게 기록하는 개인 iOS 앱으로 만들었습니다. 먹은 음식과 반응을 남기고, 이전 기록을 쉽게 살펴볼 수 있습니다.","I made a simpler iOS version of Mammacare focused on logging food and allergic reactions, with an easy way to look back through previous entries."],"points":[["React Native·Expo로 만든 iOS 앱입니다","An iOS app built with React Native and Expo"],["음식과 반응 기록은 SQLite를 사용해 기기에 저장합니다","Food and reaction entries are stored on the device using SQLite"],["기록한 반응에 따라 재료별 관찰 상태를 업데이트합니다","Each food’s observation status updates based on the reactions you record"]]},"sports-briefing":{"intro":["좋아하는 팀과 선수의 소식을 여러 곳에서 찾아볼 필요 없이, 중요한 소식만 간추려 볼 수 있도록 만들고 있습니다. 경기 일정과 주요 변화를 한곳에서 확인할 수 있습니다.","Catch up on your favorite teams and players without checking multiple sources. Sports Briefing brings together schedules and important updates in one place."],"badge":["개발 중","In development"],"points":[["Python·FastAPI로 경기 일정과 소식을 제공하는 API를 만들었습니다","Built a Python/FastAPI API for schedules and updates"],["여러 출처의 데이터를 SQLite에 저장하고, 최신성과 중요도에 따라 보여줄 소식을 고릅니다","Stores data from multiple sources in SQLite and selects updates based on freshness and importance"]]},"stock-game":{"intro":["가상 자금으로 한국과 미국 주식에 투자하는 게임입니다. 시작 금액과 투자 기간을 직접 정하고, 주식을 사고팔며 자산을 얼마나 늘릴 수 있는지 도전해 봅니다.","A stock market game where you invest virtual money in Korean and US stocks. Choose your starting funds and how long to play, then see how much you  const technical=d.points?`<section class="concise-technical"><h2>${t('만든 방식','How it is built')}</h2><ul>${d.points.map(point=>`<li>${pick(point)}</li>`).join('')}</ul></section>`:`<p class="concise-stack">${escapeHtml(d.stack)}</p>`;
 const links=`<div class="concise-links">${p.link?`<a href="${p.link}" target="_blank" rel="noreferrer">${p.id==='filing-digest'?t('읽기 전용 데모 보기 ↗','View read-only walkthrough ↗'):p.id==='filing-agent'?t('녹화 데모 보기 ↗','View recorded demo ↗'):p.id==='stock-game'?t('게임 열기 ↗','Open game ↗'):t('웹사이트 열기 ↗','Open website ↗')}</a>`:''}${p.code?`<a href="${p.code}" target="_blank" rel="noreferrer">GitHub ↗</a>`:''}</div>`;
 const related=p.id==='allergy-tracker'?`<a class="next" href="#project/mammacare"><span>${t('연결된 팀 프로젝트','Related team project')}</span><strong>Mammacare</strong></a>`:'';
 return `<main id="main" class="detail concise-detail"><a class="back" href="#projects">${t('프로젝트 목록으로','Back to projects')}</a><div class="detail-head">${badge}<h1>${name(p)}</h1><p class="description">${pick(d.intro)}</p></div><div class="case-body">${gallery(p)}${note}${technical}${links}${related}</div></main>`;
}
function detail(p){if(conciseDetails[p.id])return conciseDetail(p);if(p.id==='mammacare')return mammacareDetail(p);if(p.id==='glass-table')return glassDetail(p);const related=data.find(x=>x.id===p.related)||data[(data.indexOf(p)+1)%data.length];return `<main id="main" class="detail"><a class="back" href="#projects">${t('프로젝트 목록으로','Back to projects')}</a><div class="detail-head"><p class="eyebrow">${pick(p.type)}</p><h1>${name(p)}</h1><p class="promise">${pick(p.promise)}</p><p class="description">${pick(p.desc)}</p>${projectLinks(p)}</div><div class="case-body"><p class="stack">${p.stack.split(' · ').map(item=>`<span class="stack-item">${escapeHtml(item)}</span>`).join('')}</p><section class="chapter"><h2>${pick(caseQuestions[p.id][0])}</h2><p>${pick(p.problem)}</p></section>${gallery(p)}${['role','decision','evidence'].map((key,i)=>`<section class="chapter"><h2>${pick(caseQuestions[p.id][i+1])}</h2><p>${pick(p[key])}</p>${key==='decision'?decisionVisual(p):''}</section>`).join('')}<a class="next" href="#project/${related.id}"><span>${t(p.related?'연결된 프로젝트':'다음 프로젝트',p.related?'Related project':'Next project')}</span><strong>${name(related)}</strong></a></div></main>`}

function introduction(){return `<section id="about" class="hero combined-intro"><h1>${t('AI와 데이터를 연결하는 백엔드 개발','Backend development with AI and data')}</h1><p class="hero-support">${t('궁금한 게 생기면 직접 만들어 봅니다','I build things I’m curious about')}</p></section>`}
function qualifications(){return `<section id="background" class="background"><div class="qualification-groups"><section><h2>${t('교육','Education')}</h2><div>${t('Microsoft 인공지능 SW 아카데미 3기','Microsoft AI Software Academy')}<br>The University of Texas at Austin</div></section><section><h2>${t('자격증','Certifications')}</h2><div>SQLD<br>Azure AI Fundamentals (AI-900)</div></section></div></section>`}

function render(mode){document.documentElement.lang=language?'en':'ko';const p=route();return `<div class="shell ${mode}">${nav()}${p?detail(p):`<main id="main">${introduction()}<section id="projects"><div class="sectionline"><h2>${t('프로젝트','Projects')}</h2></div>${data.map(row).join('')}</section>${qualifications()}</main>`}${footer()}</div>`}

let activeViewTransition=null,renderVersion=0;
function transitionView(update,after,animate=true){const version=++renderVersion;activeViewTransition?.skipTransition();if(typeof document.startViewTransition!=='function'){update();after?.(version);return}const transition=document.startViewTransition(()=>{update()});activeViewTransition=transition;if(!animate)transition.skipTransition();transition.ready.catch(()=>{});transition.updateCallbackDone.then(()=>{if(version===renderVersion)after?.(version)},()=>{});transition.finished.catch(()=>{}).then(()=>{if(activeViewTransition===transition)activeViewTransition=null})}
function springEasing(){return getComputedStyle(document.documentElement).getPropertyValue('--spring').trim()||'linear'}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;if(a.hasAttribute('data-language')){if(location.protocol==='file:')return;e.preventDefault();const y=scrollY;language=language?0:1;const u=new URL(location);u.pathname=language?'/en/':'/ko/';u.search='';history.replaceState(null,'',u);rerender(()=>{if(e.detail>0&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelector('.nav-current')?.animate([{opacity:.4},{opacity:1}],{duration:180,easing:springEasing()})},true,()=>{document.querySelector('[data-language]')?.focus({preventScroll:true});window.scrollTo({top:y,behavior:'instant'})});return}if(a.hash&&a.origin===location.origin&&!a.hash.startsWith('#project/')&&route()){e.preventDefault();history.pushState(null,'',a.hash);rerender(null,true,()=>document.getElementById(a.hash.slice(1))?.scrollIntoView({behavior:'instant'}))}});
window.addEventListener('hashchange',()=>rerender(null,true,()=>{if(route()||location.hash==='#home')window.scrollTo({top:0,behavior:'instant'});else document.getElementById(location.hash.slice(1))?.scrollIntoView({behavior:'instant'})}));
window.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement){const img=e.target;img.alt=t('이미지를 불러오지 못했습니다. 프로젝트 설명을 확인해 주세요.','Image unavailable. Please read the project description.')}},true);

data.push({id:'glass-table',name:'Glass Table',stack:'Swift · SwiftUI',type:['개인 프로젝트 · iOS','Personal project · iOS']});
const revealedProjects=new Set();
const projectObserver='IntersectionObserver'in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches?new IntersectionObserver(entries=>{entries.forEach(entry=>{if(!entry.isIntersecting)return;revealedProjects.add(entry.target.id);entry.target.classList.add('in-view');projectObserver.unobserve(entry.target)})},{threshold:.12}):null;
if(projectObserver)document.documentElement.classList.add('reveal-projects');
function observeProjects(){projectObserver?.disconnect();document.querySelectorAll('.project').forEach((project,index)=>{project.style.setProperty('--i',index);if(!projectObserver||revealedProjects.has(project.id))project.classList.add('in-view');else projectObserver.observe(project)})}
data.push({id:'sports-briefing',name:'Sports Briefing',stack:'Python · FastAPI · SQLite · SwiftUI',type:['개인 프로젝트 · 개발 중','Personal project · In development'],promise:['좋아하는 팀과 선수의 중요한 소식만 간추립니다.','A personal sports briefing focused on what matters right now.'],desc:['좋아하는 팀과 선수의 중요한 소식만 간추려 보여주는 앱','A personal sports briefing focused on what matters right now'],problem:['좋아하는 팀과 선수의 소식에서 지금 알아둘 변화만 짧게 확인하고 싶었습니다. 보여줄 만한 소식이 없으면 빈 목록도 허용하고, 경기 결과는 기본적으로 숨깁니다.','I want a short answer to what matters for the teams and players I follow right now. The briefing can stay empty when nothing qualifies, and results are hidden by default.'],role:['자료를 정리하고 최신성과 사용 권한을 확인한 뒤, 중요한 항목을 고르는 규칙과 API를 만들었습니다. iPhone 시제품은 현재 Arsenal 소식만 다룹니다.','I built source normalization, freshness and rights checks, ranking rules, and an API. The current iPhone prototype covers Arsenal only.'],decision:['각 팀·선수에 최대 두 항목만 보여주고, 공개 사용 권한이 확인되지 않은 자료는 공개 화면에서 제외합니다. 선택과 순위는 규칙으로 정합니다.','The timeline shows at most two items per team or player. Unresolved public-use rights keep source data out of the public view. Explicit rules decide selection and ranking.'],evidence:['개발 중인 프로젝트입니다. 공개 모드에서 Texans와 Scottie 자료는 명시적으로 표시된 예시 데이터이고 Arsenal은 현재 사용 불가로 표시합니다. 실제 AI 모델 연결과 배포된 서비스는 아직 없습니다.','This project is in development. Public mode labels Texans and Scottie items as demo data and marks Arsenal unavailable. A real AI model and a deployed service are not yet available.'],code:'https://github.com/mhju0/sports-briefing'});
const projectOrder=["glass-table", "filing-digest", "filing-agent", "fullcourt", "raintoday", "mammacare", "allergy-tracker", "sports-briefing", "stock-game"];
data.sort((a,b)=>projectOrder.indexOf(a.id)-projectOrder.indexOf(b.id));
const projectSummaries={"glass-table": [["포커를 처음부터 배우고 직접 연습할 수 있는 iPhone 앱", "An iPhone app for learning and practicing poker, one hand at a time"], ["출시 준비 중", "Preparing for release"]], "filing-digest": [["기업 공시의 주요 수치를 원문과 함께 살펴보는 앱", "Explore key figures from company filings, with the original sources"]], "filing-agent": [["기업 공시의 수치를 질문하고 비교해 보는 앱", "Ask questions about company filings and compare the figures"]], "fullcourt": [["NBA 경기 일정과 팀별 휴식일을 한눈에 비교하는 웹사이트", "See the NBA schedule and compare how much rest each team gets"]], "raintoday": [["5개 날씨 서비스의 강수 예보를 비교하고, 실제 관측으로 정확도를 평가하는 웹사이트", "Compare rain forecasts from five weather providers and see how accurately they predicted the rain"]], "mammacare": [["아기가 먹은 음식과 알레르기 반응을 함께 기록하는 앱", "Track your baby’s food and allergic reactions in one place"], ["팀 프로젝트", "Team project"]], "allergy-tracker": [["팀 프로젝트 Mammacare를 바탕으로 직접 만든 iOS 음식·알레르기 기록 앱", "A personal iOS adaptation of Mammacare for tracking food and allergic reactions"]], "sports-briefing": [["좋아하는 팀과 선수의 중요한 소식만 간추려 보여주는 앱", "A personal sports briefing focused on what matters right now"], ["개발 중", "In development"]], "stock-game": [["가상 자금으로 한국과 미국 주식에 투자하며 수익률에 도전하는 게임", "A stock market game for growing a virtual portfolio of Korean and US stocks"]]};
data.forEach(p=>{[p.summary,p.status]=projectSummaries[p.id]});
function rerender(after,animate=true,during){const update=()=>{document.getElementById('stage').innerHTML=render('spacious');document.title=t('주민현 · 포트폴리오','Michael Ju · Portfolio');document.querySelector('.skip').textContent=t('본문으로 이동','Skip to content');observeProjects();during?.()};transitionView(update,after,animate)}
document.addEventListener('pointerdown',()=>{activeViewTransition?.skipTransition();document.documentElement.classList.add('pointer')});
document.addEventListener('keydown',()=>{activeViewTransition?.skipTransition();document.documentElement.classList.remove('pointer')});
rerender(null,false);
</script></body></html>
